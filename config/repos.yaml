repos:
  - owner: huggingface
    name: text-embeddings-inference
  - owner: vllm-project
    name: vllm
  - owner: milvus-io
    name: milvus
  - owner: langgenius
    name: dify
  - owner: modelcontextprotocol
    name: python-sdk
  - owner: kubernetes
    name: kubernetes
  - owner: NVIDIA
    name: NemoClaw
  - owner: openclaw
    name: openclaw

news:
  hackernews_enabled: true
  hackernews_top_n: 20
  hackernews_min_score: 50
  rss_feeds:
    - name: "TechCrunch AI"
      url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    - name: "The Verge AI"
      url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"

papers:
  arxiv_categories:
    - "cs.AI"
    - "cs.CL"
    - "cs.LG"
  arxiv_max_per_category: 10
  arxiv_keywords: []

filters:
  min_reactions: 0
  min_comments_for_issue: 3
  min_comments_for_pr: 2
  lookback_days: 1
  include_labels:
    - "breaking change"
    - "breaking-change"
    - "type: breaking change"
    - "security"
    - "vulnerability"
    - "bug"
    - "enhancement"
    - "feature"

ai:
  flash_model: "gemini-2.5-flash"
  pro_model: "gemini-2.5-pro-preview-05-06"
  max_summary_tokens: 300
  max_diff_tokens: 150000
  diff_chunk_size: 50000

telegram:
  max_events_per_message: 10
  critical_only_for_immediate: true
