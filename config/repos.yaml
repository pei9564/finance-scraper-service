news:
  hackernews_enabled: true
  hackernews_top_n: 20
  hackernews_min_score: 50
  rss_feeds:
    - name: "TechCrunch AI"
      url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    - name: "The Verge AI"
      url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"

finance:
  rss_feeds:
    # 台股 / 中文財經
    - name: "經濟日報 國際"
      url: "https://money.udn.com/rssfeed/news/1001/5588/5599?ch=money"
    - name: "經濟日報 焦點"
      url: "https://money.udn.com/rssfeed/news/1001/5591/5612?ch=money"
    # 美股 / 國際財經
    - name: "CNBC Top News"
      url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"
    - name: "MarketWatch Top Stories"
      url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"
    - name: "Yahoo Finance"
      url: "https://finance.yahoo.com/news/rssindex"

papers:
  arxiv_categories:
    - "cs.AI"
    - "cs.CL"
    - "cs.LG"
    - "cs.CV"
    - "cs.NE"
    - "stat.ML"
    - "cs.IR"
    - "cs.RO"
    - "cs.HC"
    - "cs.DC"
    - "cs.AR"
    - "cs.SE"
    - "cs.CR"
    - "eess.AS"
    - "eess.IV"
  arxiv_fetch_limit: 200
  arxiv_top_n: 5
  arxiv_keywords: []
  hf_papers_enabled: true
  hf_top_n: 5

filters:
  min_reactions: 0
  min_comments_for_issue: 3
  min_comments_for_pr: 2
  lookback_days: 30
  include_labels:
    - "breaking change"
    - "breaking-change"
    - "type: breaking change"
    - "security"
    - "vulnerability"
    - "bug"
    - "enhancement"
    - "feature"

ai:
  # 內部 LLM gateway（OpenAI 相容）；真實位址/金鑰用 .env 的 VLLM_* 覆蓋
  vllm_enabled: true
  vllm_base_url: "http://localhost:8000/v1"
  vllm_model: ""  # 留空自動偵測
  # 各來源的逐則摘要設定（指令文字與長度可直接在此調整，不用改程式）
  summary_profiles:
    news:
      max_tokens: 600
      instruction: |
        請用繁體中文，以大約 200 字摘要以下新聞的重點，
        涵蓋事件背景、關鍵細節與影響。
        只輸出摘要本身，不要開場白、結語、條列符號或 markdown 符號。
    paper:
      max_tokens: 1200
      instruction: |
        請用繁體中文，以大約 400-500 字盡可能完整地摘要以下論文，
        內容包含：研究要解決的問題、採用的方法、主要發現與結論。
        重要：讀者是非資訊科系的學生，請用淺顯易懂的白話文說明，
        避免專業術語；若必須使用術語，請順帶用一句話解釋它的意思，
        必要時可用生活化的比喻幫助理解。
        只輸出摘要本身，不要開場白、結語或 markdown 符號。
    finance:
      max_tokens: 600
      instruction: |
        請用繁體中文，以大約 150-200 字摘要以下財經新聞的重點，
        涵蓋：事件本身、影響的市場/標的、可能的後續影響或意涵。
        若新聞內含具體數字（漲跌幅、價位、成交量、利率等）請保留。
        只輸出摘要本身，不要開場白、結語、條列符號或 markdown 符號。

# 各來源的開關與逐則處理步驟鏈（步驟名稱對應 sources/registry.py 的 STEP_FACTORIES）
sources:
  github:
    enabled: true
    steps: []
  news:
    enabled: true
    steps: [summarize]
  paper:
    enabled: true
    steps: [summarize]
  finance:
    enabled: true
    steps: [summarize]

# 各輸出目標的開關
outputs:
  web:
    enabled: true
