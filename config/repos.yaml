filters:
  min_reactions: 0
  min_comments_for_issue: 3
  min_comments_for_pr: 2
  lookback_days: 1
  include_labels:
    - "breaking change"
    - "breaking-change"
    - "type: breaking change"
    - "security"
    - "vulnerability"
    - "bug"
    - "enhancement"
    - "feature"

ai:
  flash_model: "gemini-2.5-flash"
  pro_model: "gemini-2.5-pro-preview-05-06"
  max_summary_tokens: 300
  max_diff_tokens: 150000
  diff_chunk_size: 50000

telegram:
  max_events_per_message: 10
  critical_only_for_immediate: true
