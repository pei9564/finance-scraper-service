papers:
  arxiv_categories:
    - "cs.AI"
    - "cs.CL"
    - "cs.LG"
    - "cs.CV"
    - "cs.NE"
    - "stat.ML"
    - "cs.IR"
    - "cs.RO"
    - "cs.HC"
    - "cs.DC"
    - "cs.AR"
    - "cs.SE"
    - "cs.CR"
    - "eess.AS"
    - "eess.IV"
  arxiv_fetch_limit: 200
  arxiv_top_n: 5
  arxiv_keywords: []
  hf_papers_enabled: true
  hf_top_n: 5

# YouTube + Podcast (走外部 STT 服務逐字稿,再進 daily pipeline 跟 news 一起摘要/翻譯)
# 真實 STT URL 透過 env STT_BASE_URL 覆蓋。每個 channels 條目可加 lang: zh 跳翻譯。
media:
  stt_base_url: "http://localhost:8000"
  stt_poll_interval_seconds: 15
  stt_timeout_seconds: 900
  stt_language: ""           # 留空 STT 自動偵測
  per_channel_episodes: 1    # 每個頻道每次抓最新幾集
  youtube_tech:
    channels: []             # 例: - {name: "Fireship", url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCsBjURrPoezykLs9EqgamOA"}
  youtube_fin:
    channels:
      - name: "老王愛說笑"
        url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCvnLmiWt_zIVIh0zUm_j4Hw"
        lang: zh
  podcast_tech:
    channels: []
  podcast_fin:
    channels: []

filters:
  # 所有 collector 只看 24 小時內(news / finance / paper / media 共用)。
  # 漏跑一天會漏該天 — 若有需要可調 2~3 提供補抓緩衝
  lookback_days: 1

ai:
  # 內部 LLM gateway（OpenAI 相容）；真實位址/金鑰用 .env 的 VLLM_* 覆蓋
  vllm_enabled: true
  vllm_base_url: "http://localhost:8000/v1"
  vllm_model: ""  # 留空自動偵測
  # 各來源的逐則摘要設定（指令文字與長度可直接在此調整，不用改程式）
  summary_profiles:
    news:
      max_tokens: 600
      instruction: |
        請用繁體中文，以大約 200 字摘要以下新聞的重點，
        涵蓋事件背景、關鍵細節與影響。
        只輸出摘要本身，不要開場白、結語、條列符號或 markdown 符號。
    paper:
      max_tokens: 1200
      instruction: |
        請用繁體中文，以大約 400-500 字盡可能完整地摘要以下論文，
        內容包含：研究要解決的問題、採用的方法、主要發現與結論。
        重要：讀者是非資訊科系的學生，請用淺顯易懂的白話文說明，
        避免專業術語；若必須使用術語，請順帶用一句話解釋它的意思，
        必要時可用生活化的比喻幫助理解。
        只輸出摘要本身，不要開場白、結語或 markdown 符號。
    finance:
      max_tokens: 600
      instruction: |
        請用繁體中文，以大約 150-200 字摘要以下財經新聞的重點，
        涵蓋：事件本身、影響的市場/標的、可能的後續影響或意涵。
        若新聞內含具體數字（漲跌幅、價位、成交量、利率等）請保留。
        只輸出摘要本身，不要開場白、結語、條列符號或 markdown 符號。
    release:
      max_tokens: 500
      instruction: |
        請用繁體中文，以大約 150 字摘要以下 GitHub release notes 的重點，
        聚焦在「這版改了什麼」、是否有破壞性更新（breaking changes）、
        對使用者的影響。若 release notes 含明確的 bug fix / new feature
        條列請挑 2-3 個最重要的提到。
        只輸出摘要本身，不要開場白、結語或 markdown 符號。
    # YouTube / Podcast 共用同一份指令 - 摘要逐字稿。用 YAML anchor 統一管理
    youtube_tech: &media_summary
      max_tokens: 800
      instruction: |
        請用繁體中文，以大約 250-300 字摘要以下影片或 Podcast 逐字稿的重點，
        涵蓋：節目主題、討論的重點論點、結論或關鍵案例。
        若內容偏技術，保留核心技術名詞；若偏財經，保留具體數字。
        只輸出摘要本身，不要開場白、結語或 markdown 符號。
    youtube_fin: *media_summary
    podcast_tech: *media_summary
    podcast_fin: *media_summary

# 各來源的開關與逐則處理步驟鏈（步驟名稱對應 sources/registry.py 的 STEP_FACTORIES）
sources:
  news:
    enabled: true
    steps: [translate, fetch_body, summarize]
  paper:
    enabled: true
    steps: [translate, summarize]
  finance:
    enabled: true
    steps: [translate, summarize]
  # 預設關閉 - channels 為空時也不會做事;設好 channels 後再 enabled: true
  youtube_tech:
    enabled: false
    steps: [translate, summarize]
  youtube_fin:
    enabled: true
    steps: [translate, summarize]
  podcast_tech:
    enabled: false
    steps: [translate, summarize]
  podcast_fin:
    enabled: false
    steps: [translate, summarize]

# 各輸出目標的開關
outputs:
  web:
    enabled: true
