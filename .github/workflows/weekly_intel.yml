name: Daily GitHub Collector

on:
  schedule:
    # 每天 01:30 UTC = 09:30 CST (UTC+8)
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collector:
    name: Run Collector Pipeline
    runs-on: ubuntu-latest
    environment: GOOGLE_API_KEY
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 取回既有網頁資料
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-data
        continue-on-error: true

      - name: 還原既有資料
        run: |
          mkdir -p output/weekly
          if [ -d gh-pages-data ]; then
            cp gh-pages-data/*.json output/weekly/ 2>/dev/null || true
          fi

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: 安裝依賴
        run: uv sync

      - name: 執行 GitHub Collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_ACTIVITY_LOGS: ${{ secrets.NOTION_DB_ACTIVITY_LOGS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python src/main.py

      - name: 部署到 GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output/weekly

      - name: 上傳 JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-intel-${{ github.run_number }}
          path: output/weekly/
          retention-days: 30
