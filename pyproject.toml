[project]
name = "github-intel"
version = "0.1.0"
description = "自動化 GitHub 技術情報收集與分析系統"
requires-python = ">=3.12"
dependencies = [
    "PyGithub==2.3.0",
    "notion-client==2.2.1",
    "python-telegram-bot==21.3",
    "pydantic==2.7.0",
    "pyyaml==6.0.1",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "feedparser>=6.0.0",
    "arxiv>=2.1.0",
    "trafilatura>=1.12.0",
]

[project.scripts]
tech-intel = "tech_intel.main:cli"
tech-intel-server = "tech_intel.server:cli"
tech-intel-retry = "tech_intel.retry:cli"
tech-intel-monthly = "tech_intel.monthly:cli"

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
